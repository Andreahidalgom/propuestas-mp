<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mapa de visitas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a}
.top{background:#fff;border-bottom:1px solid #e0ddd8;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;margin-right:auto}
select{padding:7px 10px;font-size:13px;border:1px solid #e0ddd8;border-radius:8px;background:#f9f8f6;color:#333;font-family:inherit}
.count{font-size:12px;color:#888;padding:6px 10px;background:#f0eeff;border-radius:8px;color:#534AB7;font-weight:500}
.navlink{font-size:13px;font-weight:500;color:#534AB7;text-decoration:none;background:#f0eeff;padding:7px 12px;border-radius:8px;display:flex;align-items:center;gap:5px;border:1px solid #AFA9EC;white-space:nowrap}
.navlink:hover{background:#e4e0ff}
#map{height:calc(100vh - 60px);width:100%}
.status{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:13px;color:#777;z-index:1000}
.leaflet-popup-content{font-size:13px;line-height:1.5}
.leaflet-popup-content b{color:#534AB7}
</style>
</head>
<body>
<div class="top">
  <h1>🗺️ Mapa de visitas</h1>
  <select id="fUsuario"><option value="">Todos los ejecutivos</option></select>
  <select id="fDias">
    <option value="0">Todo el historial</option>
    <option value="7">Últimos 7 días</option>
    <option value="30" selected>Últimos 30 días</option>
    <option value="90">Últimos 90 días</option>
  </select>
  <span class="count" id="cont">0 visitas</span>
  <a class="navlink" href="mis-comercios.html">📋 Mis comercios</a>
  <a class="navlink" href="registro-visita.html">← Volver a registrar</a>
</div>
<div id="map"></div>
<div class="status" id="status" style="display:none">Cargando visitas...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ⚠️ Debe ser la misma URL que usas en registro-visita.html
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNH-UzkC5s-wOoTdO1mz5uNlwG02Q_ul3__yS_w1-pcAP6zhPK4Rbmvo0iFCQ3QbvboA/exec";

const map = L.map('map').setView([-33.45, -70.65], 11); // Santiago por defecto
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

let markersLayer = L.layerGroup().addTo(map);
let todasLasRutas = [];

const colores = ['#534AB7','#D85A30','#1D9E75','#B8860B','#3C3489','#7A1010','#0E7490','#A21CAF'];
function colorPara(usuario) {
  let h = 0;
  for (let i = 0; i < usuario.length; i++) h = (h * 31 + usuario.charCodeAt(i)) % colores.length;
  return colores[Math.abs(h)];
}

async function cargar() {
  document.getElementById('status').style.display = 'block';
  try {
    const resp = await fetch(APPS_SCRIPT_URL + '?action=listarRutas');
    const data = await resp.json();
    if (!data.ok) throw new Error(data.mensaje || 'Error al cargar');
    todasLasRutas = data.rutas || [];

    const usuarios = [...new Set(todasLasRutas.map(r => r.usuario).filter(Boolean))].sort();
    const sel = document.getElementById('fUsuario');
    usuarios.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u; opt.textContent = u;
      sel.appendChild(opt);
    });

    pintar();
  } catch (err) {
    document.getElementById('status').textContent = 'No se pudo cargar el mapa: ' + err.message;
    return;
  }
  document.getElementById('status').style.display = 'none';
}

function pintar() {
  markersLayer.clearLayers();
  const usuario = document.getElementById('fUsuario').value;
  const dias = Number(document.getElementById('fDias').value);
  const ahora = new Date();

  const filtradas = todasLasRutas.filter(r => {
    if (usuario && r.usuario !== usuario) return false;
    if (dias > 0) {
      const f = new Date(r.fecha);
      const diff = (ahora - f) / (1000 * 60 * 60 * 24);
      if (diff > dias) return false;
    }
    return true;
  });

  const bounds = [];
  filtradas.forEach(r => {
    const marker = L.circleMarker([r.lat, r.lng], {
      radius: 7,
      color: colorPara(r.usuario),
      fillColor: colorPara(r.usuario),
      fillOpacity: 0.75,
      weight: 2
    });
    const fecha = r.fecha ? new Date(r.fecha).toLocaleDateString('es-CL') : '';
    marker.bindPopup(
      `<b>${r.comercio || 'Sin nombre'}</b><br>${r.calle || ''}${r.calle && r.comuna ? ', ' : ''}${r.comuna || ''}<br>👤 ${r.usuario || '—'}<br>📅 ${fecha}`
    );
    marker.addTo(markersLayer);
    bounds.push([r.lat, r.lng]);
  });

  document.getElementById('cont').textContent = filtradas.length + (filtradas.length === 1 ? ' visita' : ' visitas');

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
  }
}

document.getElementById('fUsuario').addEventListener('change', pintar);
document.getElementById('fDias').addEventListener('change', pintar);

cargar();
</script>
</body>
</html>
